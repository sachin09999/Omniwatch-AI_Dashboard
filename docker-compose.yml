services:
  omnivision-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivision-web
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - NODE_ENV=production
      - PORT=8090
      - BACKEND_URL=${BACKEND_URL:-http://10.10.12.52:8009}
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
