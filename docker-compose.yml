services:
  omnivision-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivision-web
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - NODE_ENV=production
      - PORT=8090
      - BACKEND_URL=${BACKEND_URL:-http://10.10.12.52:8009}
      - AUTH_LOGIN_URL=${AUTH_LOGIN_URL:-http://10.10.12.52:5003/api/auth/login}
      - AUTH_EMAIL=${AUTH_EMAIL:-admin@digital-twin-solutions.com}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-U2FsdGVkX1/dpHps2crzBKIZH8nK3A+A89BV1+Q2lZs=}
      - BACKEND_AUTH_TOKEN=${BACKEND_AUTH_TOKEN:-oat_NjM.V1FYb2lTU2FyQXFFWUc0U2dNRHFSVV9ha3c3OVVHV1NvblNaUTQ4ZTMwMjY4NTcyOQ}
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
